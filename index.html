<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Ledger</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --green: #32d74b; --red: #ff453a; --accent: #0a84ff; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
        
        .balance-card { 
            background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
            padding: 30px; border-radius: 25px; text-align: center; margin-bottom: 20px; border: 1px solid #333; 
        }
        #total-balance { font-size: 40px; font-weight: bold; margin-top: 10px; }
        
        input { 
            width: 100%; background: #2c2c2e; border: none; border-radius: 12px; 
            color: white; padding: 15px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; 
            outline: none;
        }
        
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { height: 55px; border-radius: 15px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .in { background: var(--green); color: #000; }
        .out { background: var(--red); color: #fff; }
        
        .history { margin-top: 30px; }
        .item { 
            background: var(--card); padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .item-info { display: flex; flex-direction: column; }
        .date { font-size: 10px; color: #8e8e93; }
        
        .clear-btn { background: none; color: #ff453a; font-size: 12px; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

    <div class="balance-card">
        <div style="color: #8e8e93; font-size: 14px;">ПОТОЧНИЙ БАЛАНС</div>
        <div id="total-balance">0.00 ₴</div>
    </div>

    <input type="number" id="amount" placeholder="Сума (грн)" inputmode="decimal">
    <input type="text" id="note" placeholder="На що витратили?">
    
    <div class="btns">
        <button class="in" onclick="addTx('plus')">↑ ПРИХІД</button>
        <button class="out" onclick="addTx('minus')">↓ ВИТРАТА</button>
    </div>

    <div class="history">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="font-weight: bold; font-size: 20px;">Історія</span>
        </div>
        <div id="list"></div>
    </div>

    <button class="clear-btn" onclick="clearData()">Очистити всі дані</button>

    <script>
        // Завантаження даних з пам'яті телефону (LocalStorage)
        let transactions = JSON.parse(localStorage.getItem('my_ledger_data')) || [];

        function render() {
            const list = document.getElementById('list');
            const totalDisplay = document.getElementById('total-balance');
            list.innerHTML = "";
            let balance = 0;

            transactions.slice().reverse().forEach((t, index) => {
                balance += (t.type === 'plus' ? t.amount : -t.amount);
                
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="item-info">
                        <span style="font-weight: 500;">${t.note}</span>
                        <span class="date">${t.date}</span>
                    </div>
                    <span style="font-weight: bold; color: ${t.type === 'plus' ? 'var(--green)' : 'var(--red)'}">
                        ${t.type === 'plus' ? '+' : '-'}${t.amount.toFixed(2)}
                    </span>
                `;
                list.appendChild(div);
            });

            totalDisplay.innerText = balance.toFixed(2) + " ₴";
            localStorage.setItem('my_ledger_data', JSON.stringify(transactions));
        }

        function addTx(type) {
            const amountInput = document.getElementById('amount');
            const noteInput = document.getElementById('note');
            const amount = parseFloat(amountInput.value);
            const note = noteInput.value || (type === 'plus' ? 'Дохід' : 'Витрата');

            if (!amount) return;

            const newTx = {
                amount,
                note,
                type,
                date: new Date().toLocaleString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
            };

            transactions.push(newTx);
            amountInput.value = "";
            noteInput.value = "";
            render();
        }

        function clearData() {
            if (confirm("Видалити всі записи?")) {
                transactions = [];
                render();
            }
        }

        // Перший запуск
        render();
    </script>
</body>
</html>
