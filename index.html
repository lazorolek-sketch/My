<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multi-Wallet Pro 6-Pin</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --green: #32d74b; --red: #ff453a; --accent: #0a84ff; --gray: #2c2c2e; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        
        /* Екран авторизації */
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
        #main-content { display: none; }

        .total-card { background: linear-gradient(180deg, #2c2c2e, #1c1c1e); padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 15px; border: 1px solid var(--accent); }
        
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .balance-card { background: var(--card); padding: 12px 5px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        
        .val { font-size: 15px; font-weight: bold; margin-top: 5px; }
        .label { color: #8e8e93; font-size: 10px; text-transform: uppercase; }

        .input-box { background: var(--card); padding: 20px; border-radius: 25px; margin-bottom: 20px; }
        input { width: 100%; background: var(--gray); border: none; border-radius: 12px; color: white; padding: 15px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        
        .currency-switch { display: flex; gap: 8px; margin-bottom: 15px; }
        .cur-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--gray); background: none; color: #8e8e93; font-size: 12px; }
        .cur-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { height: 55px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; }
        .in { background: var(--green); color: black; }
        .out { background: var(--red); color: white; }

        .item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .date { font-size: 10px; color: #8e8e93; }

        .rates-panel { background: #111; padding: 15px; border-radius: 15px; font-size: 11px; color: #8e8e93; margin-top: 20px; }
        .rates-panel input { width: 55px; padding: 4px; margin: 0; font-size: 11px; display: inline; background: #222; border: 1px solid #333; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2 id="auth-header">Введіть ПІН</h2>
        <p style="color: #8e8e93; font-size: 13px; margin-bottom: 15px;">Потрібно 6 цифр</p>
        <input type="password" id="pin-input" placeholder="••••••" inputmode="numeric" maxlength="6" style="width: 180px; text-align: center; font-size: 28px; letter-spacing: 8px;">
        <button onclick="handleAuth()" style="background: var(--accent); color: white; width: 180px; border-radius: 12px; margin-top: 10px; height: 50px;">ПІДТВЕРДИТИ</button>
    </div>

    <div id="main-content">
        <div class="total-card">
            <div class="label">Загальний баланс у злотих</div>
            <div id="grand-total" style="font-size: 32px; font-weight: 800; color: var(--accent);">0.00 zł</div>
        </div>

        <div class="balance-grid">
            <div class="balance-card">
                <div class="label">PLN</div>
                <div id="bal-pln" class="val">0.00</div>
            </div>
            <div class="balance-card">
                <div class="label">EUR</div>
                <div id="bal-eur" class="val">0.00</div>
            </div>
            <div class="balance-card">
                <div class="label">UAH</div>
                <div id="bal-uah" class="val">0.00</div>
            </div>
        </div>

        <div class="input-box">
            <div class="currency-switch">
                <button id="btn-PLN" class="cur-btn active" onclick="setCur('PLN')">PLN</button>
                <button id="btn-EUR" class="cur-btn" onclick="setCur('EUR')">EUR</button>
                <button id="btn-UAH" class="cur-btn" onclick="setCur('UAH')">UAH</button>
            </div>
            <input type="number" id="amount" placeholder="Сума" inputmode="decimal">
            <input type="text" id="note" placeholder="Назва (напр. Оренда)">
            <div class="btns">
                <button class="in" onclick="addTx('plus')">↑ ПРИХІД</button>
                <button class="out" onclick="addTx('minus')">↓ ВИТРАТА</button>
            </div>
        </div>

        <div id="list"></div>

        <div class="rates-panel">
            <strong>Налаштування курсів (до PLN):</strong><br><br>
            1€ = <input type="number" id="rate-eur" value="4.30" step="0.01" onchange="render()"> zł | 
            1₴ = <input type="number" id="rate-uah" value="0.10" step="0.001" onchange="render()"> zł
            <br><br>
            <span onclick="if(confirm('Видалити всі дані та ПІН?')){localStorage.clear(); location.reload();}" style="color:var(--red); font-size: 10px;">Скинути систему</span>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('ledger_v6pin')) || [];
        let currentCurrency = 'PLN';
        const savedPin = localStorage.getItem('app_pin_v6');

        if(!savedPin) {
            document.getElementById('auth-header').innerText = "Створіть ПІН-код";
        }

        function setCur(c) {
            currentCurrency = c;
            ['PLN', 'EUR', 'UAH'].forEach(cur => {
                document.getElementById('btn-' + cur).className = (cur === c ? 'cur-btn active' : 'cur-btn');
            });
        }

        function handleAuth() {
            const pin = document.getElementById('pin-input').value;
            if(!savedPin) { 
                if(pin.length === 6) { 
                    localStorage.setItem('app_pin_v6', pin); 
                    showApp(); 
                } else { alert("Введіть рівно 6 цифр!"); }
            } else {
                if(pin === savedPin) showApp(); else alert("Неправильний ПІН!");
            }
        }

        function showApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            render();
        }

        function render() {
            const list = document.getElementById('list');
            const rateEur = parseFloat(document.getElementById('rate-eur').value) || 4.3;
            const rateUah = parseFloat(document.getElementById('rate-uah').value) || 0.1;
            list.innerHTML = "";
            
            let bal = { PLN: 0, EUR: 0, UAH: 0 };

            transactions.slice().reverse().forEach(t => {
                const amt = t.type === 'plus' ? t.amount : -t.amount;
                bal[t.cur] += amt;

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div style="display:flex; flex-direction:column;">
                        <span style="font-weight:500;">${t.note}</span>
                        <span class="date">${t.date}</span>
                    </div>
                    <span style="font-weight:bold; color:${t.type==='plus'?'var(--green)':'var(--red)'}">
                        ${t.type==='plus'?'+':'-'}${t.amount.toFixed(2)} ${t.cur}
                    </span>`;
                list.appendChild(div);
            });

            document.getElementById('bal-pln').innerText = bal.PLN.toFixed(2);
            document.getElementById('bal-eur').innerText = bal.EUR.toFixed(2);
            document.getElementById('bal-uah').innerText = bal.UAH.toFixed(2);
            
            const grandTotal = bal.PLN + (bal.EUR * rateEur) + (bal.UAH * rateUah);
            document.getElementById('grand-total').innerText = grandTotal.toFixed(2) + " zł";
            
            localStorage.setItem('ledger_v6pin', JSON.stringify(transactions));
        }

        function addTx(type) {
            const a = parseFloat(document.getElementById('amount').value);
            const n = document.getElementById('note').value || (type === 'plus' ? 'Дохід' : 'Витрата');
            if(!a) return;

            transactions.push({
                amount: a, note: n, type, cur: currentCurrency,
                date: new Date().toLocaleString('uk-UA', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})
            });
            document.getElementById('amount').value = "";
            document.getElementById('note').value = "";
            render();
        }
    </script>
</body>
</html>
