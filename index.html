<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cloud Wallet Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --green: #32d74b; --red: #ff453a; --accent: #0a84ff; --gray: #2c2c2e; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 50px; }
        #auth-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; }
        #main-content { display: none; }
        .total-card { background: linear-gradient(180deg, #2c2c2e, #1c1c1e); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 15px; border: 1px solid var(--accent); }
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .balance-card { background: var(--card); padding: 12px 5px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        .val { font-size: 15px; font-weight: bold; margin-top: 5px; }
        .label { color: #8e8e93; font-size: 10px; text-transform: uppercase; }
        .input-box { background: var(--card); padding: 20px; border-radius: 25px; margin-bottom: 20px; border: 1px solid #333; }
        input { width: 100%; background: var(--gray); border: none; border-radius: 12px; color: white; padding: 15px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        .currency-switch { display: flex; gap: 8px; margin-bottom: 15px; }
        .cur-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--gray); background: none; color: #8e8e93; font-size: 12px; font-weight: bold; }
        .cur-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { height: 55px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; }
        .in { background: var(--green); color: black; }
        .out { background: var(--red); color: white; }
        .item { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid transparent; }
        .item.plus { border-left-color: var(--green); }
        .item.minus { border-left-color: var(--red); }
        .del-btn { color: #444; font-size: 20px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2 id="auth-header">Введіть ПІН</h2>
        <input type="password" id="pin-input" placeholder="••••••" inputmode="numeric" maxlength="6" style="width: 180px; text-align: center; font-size: 28px; letter-spacing: 8px;">
        <button onclick="handleAuth()" style="background: var(--accent); color: white; width: 180px; border-radius: 12px; margin-top: 15px; height: 50px;">УВІЙТИ</button>
    </div>

    <div id="main-content">
        <div class="total-card">
            <div id="grand-total" style="font-size: 34px; font-weight: 800; color: var(--accent);">0.00 zł</div>
            <div class="label" style="margin-top: 5px;">Баланс (PLN)</div>
        </div>

        <div class="balance-grid">
            <div class="balance-card"><div class="label">PLN</div><div id="bal-pln" class="val">0.00</div></div>
            <div class="balance-card"><div class="label">EUR</div><div id="bal-eur" class="val">0.00</div></div>
            <div class="balance-card"><div class="label">UAH</div><div id="bal-uah" class="val">0.00</div></div>
        </div>

        <div class="input-box">
            <div class="currency-switch">
                <button id="btn-PLN" class="cur-btn active" onclick="setCur('PLN')">PLN</button>
                <button id="btn-EUR" class="cur-btn" onclick="setCur('EUR')">EUR</button>
                <button id="btn-UAH" class="cur-btn" onclick="setCur('UAH')">UAH</button>
            </div>
            <input type="number" id="amount" placeholder="Сума" inputmode="decimal">
            <input type="text" id="note" placeholder="Нотатка">
            <div class="btns">
                <button class="in" onclick="saveData('plus')">↑ ПРИХІД</button>
                <button class="out" onclick="saveData('minus')">↓ ВИТРАТА</button>
            </div>
        </div>

        <div id="list"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://xukqkdbmxvghmvhjqltj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bIXEmqcV9w3uS5h1_97DpQ_-z_gVZ7f";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCurrency = 'PLN';
        const savedPin = localStorage.getItem('app_pin_v6');

        function setCur(c) {
            currentCurrency = c;
            ['PLN', 'EUR', 'UAH'].forEach(cur => document.getElementById('btn-' + cur).className = (cur === c ? 'cur-btn active' : 'cur-btn'));
        }

        function handleAuth() {
            const pin = document.getElementById('pin-input').value;
            if(!savedPin) {
                if(pin.length === 6) { localStorage.setItem('app_pin_v6', pin); showApp(); }
            } else if(pin === savedPin) showApp(); else alert("Неправильний ПІН");
        }

        function showApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadData();
        }

        async function loadData() {
            // Звертаємось до твоєї таблиці transactionss
            const { data, error } = await supabase.from('transactionss').select('*').order('created_at', { ascending: false });
            if(error) return console.error(error);

            const list = document.getElementById('list');
            list.innerHTML = "";
            let bal = { PLN: 0, EUR: 0, UAH: 0 };

            data.forEach(t => {
                const isPlus = t.type === 'plus';
                bal[t.cur] += isPlus ? t.amount : -t.amount;
                list.innerHTML += `
                    <div class="item ${t.type}">
                        <div style="flex:1"><b>${t.note}</b><br><small style="color:#666;font-size:10px">${new Date(t.created_at).toLocaleString()}</small></div>
                        <div style="text-align:right">
                            <b style="color:${isPlus?'var(--green)':'var(--red)'}">${isPlus?'+':'-'}${t.amount.toFixed(2)} ${t.cur}</b>
                            <div class="del-btn" onclick="deleteItem(${t.id})">×</div>
                        </div>
                    </div>`;
            });

            document.getElementById('bal-pln').innerText = bal.PLN.toFixed(2);
            document.getElementById('bal-eur').innerText = bal.EUR.toFixed(2);
            document.getElementById('bal-uah').innerText = bal.UAH.toFixed(2);
            const total = bal.PLN + (bal.EUR * 4.35) + (bal.UAH * 0.10);
            document.getElementById('grand-total').innerText = total.toFixed(2) + " zł";
        }

        async function saveData(type) {
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value || "Запис";
            if(!amount) return;

            await supabase.from('transactionss').insert([{ amount, note, type, cur: currentCurrency }]);
            document.getElementById('amount').value = ""; document.getElementById('note').value = "";
            loadData();
        }

        async function deleteItem(id) {
            if(confirm("Видалити?")) {
                await supabase.from('transactionss').delete().eq('id', id);
                loadData();
            }
        }

        if(!savedPin) document.getElementById('auth-header').innerText = "Створіть ПІН";
    </script>
</body>
</html>
